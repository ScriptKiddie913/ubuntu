<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PYRUNNER // remote exec console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/css/xterm.min.css" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-title">PYRUNNER</div>
    <div class="auth-sub">ACCESS TOKEN REQUIRED</div>
    <input id="token-input" type="password" placeholder="paste ACCESS_TOKEN" autocomplete="off" />
    <button id="token-submit">CONNECT</button>
    <div id="auth-error" class="auth-error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">PYRUNNER<span class="brand-dim">://exec-console</span></div>
    <div class="status">
      <span id="conn-dot" class="dot dot-off"></span>
      <span id="conn-label">disconnected</span>
      <button id="logout-btn" title="clear token">LOGOUT</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>FILES</span>
        <button id="new-file-btn" title="new file">+</button>
      </div>
      <ul id="file-list" class="file-list"></ul>
      <div class="sidebar-actions">
        <label class="upload-btn">
          UPLOAD
          <input id="upload-input" type="file" hidden />
        </label>
      </div>
    </aside>

    <main class="main">
      <div class="view-tabs">
        <button id="tab-terminal-btn" class="view-tab active">TERMINAL</button>
        <button id="tab-editor-btn" class="view-tab">EDITOR</button>
      </div>

      <!-- ==================== TERMINAL VIEW ==================== -->
      <section id="view-terminal" class="view">
        <div class="term-tabbar">
          <div id="term-tab-list" class="term-tab-list"></div>
          <button id="new-term-btn" title="new terminal">+ NEW</button>
        </div>
        <div id="term-panes" class="term-panes"></div>
      </section>

      <!-- ==================== EDITOR VIEW ==================== -->
      <section id="view-editor" class="view hidden">
        <div class="editor-bar">
          <input id="current-path" class="current-path" value="main.py" />
          <button id="save-btn">SAVE</button>
          <button id="run-btn" class="primary">RUN ▶</button>
          <button id="download-btn">DL</button>
          <button id="delete-btn" class="danger">DEL</button>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>

        <div class="reqs-bar">
          <span class="reqs-label">requirements.txt</span>
          <button id="edit-reqs-btn">EDIT</button>
          <button id="install-btn">INSTALL DEPS ⇩</button>
          <button id="kill-btn" class="danger">KILL</button>
        </div>

        <pre id="run-output" class="terminal"></pre>
      </section>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/lib/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm-addon-fit/0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
