<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiDrive Pool</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▣</span>
    <span class="brand-name">MULTIDRIVE<span class="brand-accent">_POOL</span></span>
  </div>
  <div class="topbar-stats">
    <span id="stat-summary">connecting…</span>
  </div>
</header>

<main>

  <section class="array-panel">
    <div class="array-heading">
      <span class="eyebrow">POOLED CAPACITY</span>
      <span class="eyebrow-sub" id="array-heading-sub">0 shards / 0 B</span>
    </div>
    <div class="array-bar" id="array-bar">
      <!-- segments injected by JS -->
    </div>
    <div class="array-legend">
      <span><i class="swatch used"></i> used</span>
      <span><i class="swatch free"></i> free</span>
      <span><i class="swatch bad"></i> unreachable</span>
    </div>
  </section>

  <section class="accounts-panel">
    <div class="panel-heading">
      <span class="eyebrow">SHARDS</span>
      <button id="btn-add-account" class="btn-ghost">+ add google account</button>
    </div>
    <div class="account-grid" id="account-grid">
      <div class="empty-hint">no accounts connected yet</div>
    </div>
  </section>

  <section class="upload-panel">
    <div class="panel-heading">
      <span class="eyebrow">TRANSFER</span>
    </div>
    <div id="dropzone" class="dropzone">
      <div class="dropzone-inner">
        <span class="dropzone-icon">⇩</span>
        <span>drop a file here, or</span>
        <label class="btn-primary">
          browse
          <input type="file" id="file-input" hidden>
        </label>
      </div>
    </div>
    <div id="upload-status" class="upload-status"></div>
  </section>

  <section class="files-panel">
    <div class="panel-heading">
      <span class="eyebrow">OBJECTS</span>
      <span class="eyebrow-sub" id="file-count-sub">0 files</span>
    </div>
    <table class="file-table">
      <thead>
        <tr>
          <th>name</th>
          <th>size</th>
          <th>shards used</th>
          <th>status</th>
          <th>added</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="file-table-body">
        <tr><td colspan="6" class="empty-hint">no files uploaded yet</td></tr>
      </tbody>
    </table>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
